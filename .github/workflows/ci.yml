name: CI - Pipeline de Qualidade FieldOps

on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Backend API (Spring Boot + Maven + Java 17)
  # ------------------------------------------------------------------
  api-checks:
    name: Backend API (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Executar Testes e Empacotamento
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean test package -DskipTests=false

  # ------------------------------------------------------------------
  # JOB 2: Frontend Web (React 19 + Vite)
  # ------------------------------------------------------------------
  web-checks:
    name: Frontend Web (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar Dependências Limpas
        working-directory: ./frontend
        run: npm ci

      - name: Executar Linter
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Executar Build de Produção
        working-directory: ./frontend
        run: npm run build

  # ------------------------------------------------------------------
  # JOB 3: Mobile (React Native + Expo)
  # ------------------------------------------------------------------
  mobile-checks:
    name: Mobile (Typecheck, Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './fieldops-mobile/package-lock.json'

      - name: Instalar Dependências Limpas
        working-directory: ./fieldops-mobile
        run: npm ci

      - name: Verificação Estrita de Tipos (Typecheck)
        working-directory: ./fieldops-mobile
        run: npx tsc --noEmit

      - name: Executar Linter
        working-directory: ./fieldops-mobile
        run: npm run lint --if-present

      - name: Executar Testes Unitários
        working-directory: ./fieldops-mobile
        run: npm test -- --watchAll=false --passWithNoTests --if-present