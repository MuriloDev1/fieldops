services:
  postgres:
    image: postgres:16
    container_name: fieldops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - fieldops_postgres_data:/var/lib/postgresql/data

volumes:
  fieldops_postgres_data: